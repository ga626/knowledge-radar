<section class="panel form" id="evaluation-summary" data-developer-only hidden aria-label="持续评测">
  <div class="panel-head"><h3>持续评测</h3><button type="button" class="button" id="evaluation-refresh">刷新记录</button></div>
  <p id="evaluation-state" role="status" aria-live="polite">读取中</p><p class="notice" id="evaluation-detail">开发验证、研究质量和正式安装验收分别显示。</p>
  <nav class="evaluation-tabs" aria-label="评测审阅视图"><button type="button" data-eval-tab="level" aria-pressed="true">当前水平</button><button type="button" data-eval-tab="bank" aria-pressed="false">题库与变更</button><button type="button" data-eval-tab="audit" aria-pressed="false">抽查与纠错</button><button type="button" data-eval-tab="trend" aria-pressed="false">趋势比较</button></nav>
  <section data-eval-panel="level"><div id="evaluation-levels"></div><p id="evaluation-denominators" class="notice"></p><details><summary>开发用例与最近实测</summary><div id="evaluation-cases" class="eval-cases"></div></details></section>
  <section data-eval-panel="bank" hidden><p id="evaluation-health" class="notice"></p><div id="evaluation-bank"></div><button class="button" id="evaluation-more-cases" type="button" hidden>查看更多题</button><h4>最近自动决策与补偿</h4><div id="evaluation-changes"></div><button class="button" id="evaluation-more-changes" type="button" hidden>查看更多变更</button></section>
  <section data-eval-panel="audit" hidden><p class="notice">抽查与纠错，不需要逐项审批。未查看不等于认可；没有 Agent 接手时，记录会保留为“等待执行者”。</p><div id="evaluation-audit"></div><h4>提交纠错</h4><form id="evaluation-feedback-form"><label>需要纠正的题<select id="evaluation-feedback-case" required></select></label><label>你发现的问题<textarea id="evaluation-feedback-text" rows="3" maxlength="2000" required placeholder="说明哪条依据或判定不对"></textarea></label><div class="toolbar"><button class="button" type="submit">保存纠错记录</button><button class="button" type="button" id="evaluation-copy-feedback">复制纠错请求</button></div><p id="evaluation-feedback-state" role="status" aria-live="polite"></p><textarea id="evaluation-copy-text" rows="5" readonly hidden aria-label="待复制的纠错请求"></textarea></form><h4>纠错处理记录</h4><div id="evaluation-feedback-history"></div></section>
  <section data-eval-panel="trend" hidden><p class="notice">保留每次历史成绩。只比较同题、同判据、同裁判、同资料模式的固定锚点；换题和合并不算质量提升。同一对话重复作答不算独立试次。</p><div id="evaluation-trend"></div></section>
</section>
