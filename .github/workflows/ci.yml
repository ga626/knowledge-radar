name: CI
on:
  pull_request:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  checks:
    name: Check / ${{ matrix.group }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [offline, host, node]
    env:
      PYTHONUTF8: '1'
      KR_EVAL_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install Python tools for Python groups
        if: matrix.group != 'node'
        run: python -m pip install -e . pytest PyYAML
      - name: Check source and package plan
        if: matrix.group == 'offline'
        run: |
          python -m compileall -q src
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/build_product_lite_package.py --dry-run
      - name: Run selected Python boundary
        if: matrix.group != 'node'
        run: python scripts/kr_evaluate.py --store local/evaluation ci --group ${{ matrix.group }} --changed-from "${{ env.KR_EVAL_BASE }}"
      - name: Check console and selected Node tests
        if: matrix.group == 'node'
        run: |
          node scripts/build_console.mjs --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check src/onboarding/static/console.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check src/onboarding/static/research_workspace.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m scripts.kr_eval.ci node --folder local/evaluation
      - name: Upload logs even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: local/evaluation
          if-no-files-found: error
  scope:
    runs-on: windows-latest
    outputs:
      runtime: ${{ steps.scope.outputs.runtime }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Select coarse artifact boundary
        id: scope
        env:
          KR_EVAL_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python -c "import os,pathlib; from scripts.kr_eval.ci import docs_only_change,changed_paths,requires_artifact_runtime; r=pathlib.Path.cwd(); b=os.environ.get('KR_EVAL_BASE'); runtime=not docs_only_change(r,b) and requires_artifact_runtime(changed_paths(r,b)); open(os.environ['GITHUB_OUTPUT'],'a').write('runtime='+str(runtime).lower()+'\n')"
  candidate:
    name: Run temporary product package
    needs: scope
    if: needs.scope.outputs.runtime == 'true'
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install build tools
        run: python -m pip install -e . pytest
      - name: Prepare hash-locked offline runtime
        run: |
          python -m pip download --only-binary=:all: --require-hashes -r config/runtime-win-py312.lock -d local/runtime-wheelhouse
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import hashlib,json,pathlib; r=pathlib.Path('.'); m=json.loads((r/'config/runtime-artifacts.json').read_text(encoding='utf-8')); assert all((p:=r/'local/runtime-wheelhouse'/x['file']).is_file() and hashlib.sha256(p.read_bytes()).hexdigest()==x['sha256'] for x in m['wheels']), 'frozen runtime wheel mismatch'"
      - name: Consume temporary package outside checkout
        run: |
          python scripts/build_product_lite_package.py --candidate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $candidate = (Get-ChildItem release/candidates -Directory | Where-Object Name -Like "v*-${{ github.sha }}" | Select-Object -First 1).FullName
          if (-not $candidate) { throw 'Temporary candidate not found' }
          python scripts/verify_release_candidate.py --candidate-dir $candidate --content-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sample = Join-Path $env:RUNNER_TEMP 'kr-pr-sample'
          Move-Item -LiteralPath $candidate -Destination $sample
          Copy-Item scripts/verify_release_candidate.py "$sample/verify_release_candidate.py"
          Push-Location -LiteralPath $sample
          try {
            python verify_release_candidate.py --candidate-dir . --consumer-only --output "$env:RUNNER_TEMP/consumer-verification.json"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Pop-Location }
      - name: Retain diagnostic result only
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pr-runtime-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/consumer-verification.json
          if-no-files-found: ignore
  test:
    name: Python 3.12 / Windows
    if: always()
    needs: [checks, scope, candidate]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: ci-*-${{ github.run_id }}-*
          path: local/ci-jobs
      - name: Assemble required evidence
        env:
          KR_CHECK_RESULT: ${{ needs.checks.result }}
          KR_CONSUMER_REQUIRED: ${{ needs.scope.outputs.runtime }}
          KR_CONSUMER_RESULT: ${{ needs.candidate.result }}
          KR_SCOPE_RESULT: ${{ needs.scope.result }}
        run: |
          python -c "import os; assert os.environ['KR_SCOPE_RESULT']=='success'; assert os.environ['KR_CONSUMER_REQUIRED']=='false' or os.environ['KR_CONSUMER_RESULT']=='success', 'mandatory artifact runtime did not pass'"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:KR_CI_NEEDS = python -c "import os,json; print(json.dumps({g:os.environ['KR_CHECK_RESULT'] for g in ('offline','host','node')}))"
          python -m scripts.kr_eval.ci aggregate --folder local/ci-jobs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ci-batch-${{ github.run_id }}-${{ github.run_attempt }}
          path: local/ci-jobs
          if-no-files-found: error
