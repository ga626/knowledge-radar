name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python 3.12 / Windows
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and test tools
        run: python -m pip install --upgrade pip; python -m pip install -e . pytest

      - name: Compile public source
        run: python -m compileall -q src

      - name: Verify public package plan
        run: python scripts/build_product_lite_package.py --dry-run

      - name: Collect and run public product contracts
        run: python -m pytest -q tests/test_product_install.py tests/test_product_console_launcher.py tests/test_setup_wizard.py tests/test_privacy_boundaries.py tests/test_codex_stdio_contract.py tests/test_capabilities_runtime_environment.py tests/test_recruitment_configuration_gate.py tests/test_xhs_cdp_dependency_boundary.py tests/test_recruitment_city_registry.py tests/test_managed_chrome_resolution.py tests/test_release_candidate_contract.py

      - name: Verify account recovery and result evidence
        run: python -m pytest -q tests/test_xhs_task_failover.py tests/test_account_alerts.py tests/test_mcp_observability.py tests/test_boss_search_url.py tests/test_academic_provider_profiles.py tests/test_xiaohongshu_detail_regressions.py tests/test_installed_business_routes.py tests/test_browser_recovery_contract.py tests/test_manual_browser_lifetime.py

      - name: Prepare hash-locked offline runtime
        run: |
          python -m pip download --only-binary=:all: --require-hashes -r config/runtime-win-py312.lock -d local/runtime-wheelhouse
          python -c "import hashlib,json,pathlib; r=pathlib.Path('.'); m=json.loads((r/'config/runtime-artifacts.json').read_text(encoding='utf-8')); assert all((p:=r/'local/runtime-wheelhouse'/x['file']).is_file() and hashlib.sha256(p.read_bytes()).hexdigest()==x['sha256'] for x in m['wheels']), 'frozen runtime wheel mismatch'"

      - name: Verify continuous evaluation contracts
        run: python -m pytest -q tests/evaluation

      - name: Verify transcript cache and detail contracts
        run: python -m pytest -q tests/test_bilibili_asr_policy.py tests/test_detail_direct_media.py tests/test_runtime_task_fanin.py

      - name: Build immutable release candidate
        run: python scripts/build_product_lite_package.py --candidate

      - name: Verify the generated candidate
        run: python scripts/verify_release_candidate.py --candidate-dir (Get-ChildItem release/candidates -Directory | Where-Object Name -Like "v*-${{ github.sha }}" | Select-Object -First 1).FullName

      - name: Upload verified candidate
        uses: actions/upload-artifact@v4
        with:
          name: knowledgeradar-candidate-${{ github.sha }}
          path: release/candidates/v*-${{ github.sha }}
          if-no-files-found: error
