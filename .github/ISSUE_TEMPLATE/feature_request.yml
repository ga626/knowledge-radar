name: 功能建议
description: 提议新的使用场景、平台能力或产品体验改进。
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你要解决的问题
      description: 请描述用户任务，而不是只描述实现方式。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
  - type: textarea
    id: privacy
    attributes:
      label: 隐私与外部服务影响
      description: 是否需要新 API、登录、浏览器操作、账号或本地数据？
